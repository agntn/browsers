name: autofix.ci

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: v26.10.0
          cache: true
          # The library alone: lint skips docs/, so Nuxt and workerd stay out of this job.
          run-install: |
            - args: ["--frozen-lockfile", "--filter", "@agntn/browsers"]

      - name: Fix lint issues
        run: pnpm run lint:fix

      - uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a # v1.3.4
        with:
          commit-message: "chore: apply automated updates"
