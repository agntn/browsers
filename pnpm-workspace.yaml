packages:
  - docs

allowBuilds:
  "@google/genai": false
  better-sqlite3: false
  esbuild: true
  onnxruntime-node: false
  protobufjs: false
  vue-demi: true
  workerd: true

# A frozen install refuses day-old releases. The @agntn glob keeps CI green the day a sibling ships.
minimumReleaseAgeExclude:
  - "@agntn/*"

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.5.0
  vite-plus: 1.5.0

# One version per name for the library and docs/, which reads the library from ../src.
catalogs:
  deps:
    "@agntn/credentials": 0.0.2
    "@agntn/tools": 0.3.0
    "@modelcontextprotocol/server": 2.4.0
    "@vueuse/core": 15.0.0
    docus: 5.15.0
    nuxt: 4.6.4
    playwright-core: 1.65.0
    string-width: 7.2.0
    strip-ansi: 7.2.0
    ufo: 1.6.4
  dev:
    "@agntn/ox": 0.1.0
    "@earendil-works/pi-coding-agent": 1.4.0
    "@earendil-works/pi-tui": 1.4.0
    "@iconify-json/lucide": 1.2.151
    "@iconify-json/simple-icons": 1.2.101
    "@iconify-json/vscode-icons": 1.2.96
    "@modelcontextprotocol/client": 2.4.0
    "@nuxt/content": 3.16.2
    "@nuxt/ui": 4.12.0
    "@oh-my-pi/omptype": 18.4.12
    "@oh-my-pi/pi-coding-agent": 18.4.12
    "@types/node": 26.6.6
    ai: 7.0.163
    obuild: 0.4.45
    shiki: 4.6.0
    tsx: 4.23.15
    typescript: 7.0.2
    wrangler: 4.158.0
  # Docus parses through @typescript-eslint, whose peer stops below TypeScript 6.1, so the site keeps its own.
  docs:
    typescript: 5.9.3

cleanupUnusedCatalogs: true

overrides:
  vite@*: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

# Keeps pnpm 12's env document out of the lockfile. GitHub reads that one as zero dependencies.
pmOnFail: ignore
